num_epoch: 125
max_epoch: 125
patient: 10
log_iter: 100

seed: 2022
cv_fold: 1
val_ratio: 0.125
val2test: true

# data
batch_size: 4
same_psize: 128
p_batch_size: 512
img_transform: weak_strong
img_size: 256
mul_scale_ratio: 3.
num_workers: 6

pin_memory: true
prefetch_factor: 3

# model
model: r50v2_fhabmil
input_dim: 1024
inner_dim: 256
act: gelu
no_mil_bias: true
mil_norm: ln
# abmilx
abx_attn_plus: true

# train
opt: adamw
lr: 8e-5
weight_decay: 0.
warmup_epochs: 10
test_type: main
amp: true
sdpa_type: torch
all_patch_train: true