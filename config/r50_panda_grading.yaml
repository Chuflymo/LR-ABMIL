num_epoch: 120
max_epoch: 120
patient: 20
log_iter: 1000

seed: 2021
cv_fold: 1
val_ratio: 0.125

# data
batch_size: 4
same_psize: 128
p_batch_size: 2048
img_transform: strong
img_size: 256
mul_scale_ratio: 4.

num_workers: 8
pin_memory: true
prefetch_factor: 3

# model
model: r50v2_fhabmil
input_dim: 1024
inner_dim: 256
act: gelu
no_mil_bias: true
mil_norm: ln
n_classes: 6
# abmilx
n_heads: 4
abx_attn_plus: true
ffn: true

# train
opt: adamw
weight_decay: 1e-2
mm: 0.9999
test_type: main
amp: true
sdpa_type: torch
all_patch_train: true