num_epoch: 75
max_epoch: 75
patient: 10
log_iter: 100

seed: 2021
cv_fold: 1
val_ratio: 0.
val2test: true

# data
batch_size: 2
same_psize: 512
p_batch_size: 512
img_transform: weak
crop_scale: 0.25
img_size: 224
mul_scale_ratio: 4.

num_workers: 1
pin_memory: true
prefetch_factor: 3

# model
model: r18_fhabmil
input_dim: 256
inner_dim: 256
act: gelu
no_mil_bias: true
mil_norm: ln
# abmilx
abx_attn_plus: true

# train
opt: adamw
lr: 8e-5
weight_decay: 0.
warmup_epochs: 10
test_type: main
amp: true
sdpa_type: torch
all_patch_train: true